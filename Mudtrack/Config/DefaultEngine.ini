[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
; Cascaded shadow maps, not virtual shadow maps: the ground is procedural
; (non-Nanite) geometry spanning the whole field, which overflowed VSM page
; marking every frame and left the terrain reading as fully shadowed.
r.Shadow.Virtual.Enable=0

r.GenerateMeshDistanceFields=True

; No Lumen GI. Lumen's software tracing runs on mesh distance fields and
; procedural meshes have none, so the terrain got no sky bounce at all. The
; real-time captured SkyLight provides the ambient term directly.
r.DynamicGlobalIlluminationMethod=0

r.ReflectionMethod=2

r.SkinCache.CompileShaders=True

; Lumen needs a valid skylight or the scene reads as black. With r.SkyLight.
; RealTimeCapture on and a SkyAtmosphere in the level this is fine, but these
; two keep the fallback sane on machines/drivers where the capture fails.
r.Lumen.TranslucencyVolume.Enable=1
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.AmbientOcclusionStaticFraction=False

; Auto-exposure was computing a -8.5 EV bias against the near-black early
; frames and then clipping every light in the scene ("real-time sky capture
; lighting is going to be clipped", Exposure: -8.5). Pinning it removes the
; feedback loop where a dark start keeps the image dark.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.Method=0
r.EyeAdaptation.ExposureOffset=0.0
; Manual exposure values are EV100 (the cameras set AEM_Manual).
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

r.RayTracing=False

r.Substrate=True

r.Substrate.ProjectGBufferFormat=0

r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8

r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

