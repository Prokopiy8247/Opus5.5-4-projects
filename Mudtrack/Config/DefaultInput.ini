; Mudtrack input bindings.
;
; Legacy axis/action mappings are used deliberately: they are declared here, not
; as assets, so the pawn is fully drivable and testable from Python and from the
; automated tests without needing a Blueprint mapping context.

[/Script/Engine.InputSettings]
bAltEnterTogglesFullscreen=True
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
bEnableMouseSmoothing=False

+AxisMappings=(AxisName="MT_Throttle",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="MT_Throttle",Scale=-1.000000,Key=S)
+AxisMappings=(AxisName="MT_Throttle",Scale=1.000000,Key=Up)
+AxisMappings=(AxisName="MT_Throttle",Scale=-1.000000,Key=Down)
+AxisMappings=(AxisName="MT_Throttle",Scale=1.000000,Key=Gamepad_LeftY)

; S / Down are NOT bound here: they arrive as negative throttle, which the pawn
; turns into braking while rolling forward and into reverse once stopped. Bound
; here as well, holding S to reverse would also hold the brake on.
+AxisMappings=(AxisName="MT_Brake",Scale=1.000000,Key=Gamepad_LeftTriggerAxis)

+AxisMappings=(AxisName="MT_Steer",Scale=1.000000,Key=D)
+AxisMappings=(AxisName="MT_Steer",Scale=-1.000000,Key=A)
+AxisMappings=(AxisName="MT_Steer",Scale=1.000000,Key=Right)
+AxisMappings=(AxisName="MT_Steer",Scale=-1.000000,Key=Left)
+AxisMappings=(AxisName="MT_Steer",Scale=1.000000,Key=Gamepad_LeftX)

+ActionMappings=(ActionName="MT_Handbrake",Key=SpaceBar)
+ActionMappings=(ActionName="MT_Handbrake",Key=Gamepad_FaceButton_Bottom)

+ActionMappings=(ActionName="MT_ShiftUp",Key=Q)
+ActionMappings=(ActionName="MT_ShiftUp",Key=Gamepad_RightShoulder)
+ActionMappings=(ActionName="MT_ShiftDown",Key=Z)
+ActionMappings=(ActionName="MT_ShiftDown",Key=E)
+ActionMappings=(ActionName="MT_ShiftDown",Key=Gamepad_LeftShoulder)

+ActionMappings=(ActionName="MT_ToggleRange",Key=R)
+ActionMappings=(ActionName="MT_ToggleRange",Key=Gamepad_RightThumbstick)

+ActionMappings=(ActionName="MT_CycleDrive",Key=One)
+ActionMappings=(ActionName="MT_CycleCenterDiff",Key=Two)
+ActionMappings=(ActionName="MT_CycleRearDiff",Key=Three)
+ActionMappings=(ActionName="MT_CycleFrontDiff",Key=Four)

+ActionMappings=(ActionName="MT_Winch",Key=F)
+ActionMappings=(ActionName="MT_Winch",Key=Gamepad_LeftThumbstick)
+ActionMappings=(ActionName="MT_WinchRelease",Key=G)

+ActionMappings=(ActionName="MT_Recover",Key=T)
+ActionMappings=(ActionName="MT_CycleCamera",Key=C)

; Advertised in the HUD's key help; they were listed there but never bound.
+ActionMappings=(ActionName="MT_ToggleDiagnostics",Key=Tab)
+ActionMappings=(ActionName="MT_ToggleAutoGearbox",Key=M)
+ActionMappings=(ActionName="MT_LoadUp",Key=PageUp)
+ActionMappings=(ActionName="MT_LoadDown",Key=PageDown)
